{% extends "base.html" %}
{% load static %}
{% block body %}



<style>
.contact-us-page {
    padding: 60px 20px;
    background-color: #f2f4f7;
    font-family: 'Segoe UI', sans-serif;
}

.contact-us-container {
    max-width: 1000px;
    margin: auto;
    background-color: #fff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
}

.contact-us-title {
    text-align: center;
    font-size: 32px;
    color: #222;
    font-weight: 700;
    margin-bottom: 10px;
}

.contact-us-subtitle {
    text-align: center;
    font-size: 18px;
    color: #555;
    margin-bottom: 40px;
}

.contact-us-form input,
.contact-us-form textarea {
    width: 100%;
    padding: 14px 18px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.contact-us-form textarea {
    resize: vertical;
}

.contact-us-form button {
    width: 100%;
    background-color: #007bff;
    color: white;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

.contact-us-form button:hover {
    background-color: #0056b3;
}

.contact-us-info {
    margin-top: 40px;
    text-align: center;
    font-size: 15px;
    color: #555;
}
</style>

<div class="contact-us-page">
    <div class="contact-us-container">
        <h1 class="contact-us-title">Contact Us</h1>
        <p class="contact-us-subtitle">We'd love to hear from you! Fill out the form below and we'll get back to you as soon as we can.</p>

        <form class="contact-us-form" method="POST" action="">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Your Full Name" required>
            <input type="email" name="email" placeholder="Your Email Address" required>
            <input type="text" name="subject" placeholder="Subject" required>
            <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>

        <div class="contact-us-info">
            <p>Email: fms@gmail.com | Phone: +977-9819177479</p>
            <p>Address: Amarsingh Chowk, Pokhara, Nepal</p>
        </div>
    </div>
</div>

{% endblock body %}
